# VelocityBotManager 1.21.11 protocol prototype
# Start with enabled: false, finish the endpoint/auth settings, then enable one bot.

proxy:
  address: "127.0.0.1"
  port: 25565
  # Hostname and port written into the Minecraft handshake. This matters when
  # Velocity forced-host routing is enabled.
  virtual-host: "localhost"
  virtual-port: 25565

runtime:
  auto-start-delay-ms: 3000
  spawn-interval-ms: 1500
  command-interval-ms: 750
  resource-pack-step-delay-ms: 150
  resource-pack-mode: "ACCEPT_WITHOUT_DOWNLOAD"
  auto-respawn: true
  reconnect:
    initial-delay-ms: 5000
    maximum-delay-ms: 60000
    multiplier: 2.0
    jitter: 0.15
    # Zero means retry forever.
    maximum-attempts: 0

bots:
  IronFarm01:
    enabled: false
    username: "AFK_Iron01"
    password: "change-this-password"
    target-server: "survival"
    render-distance: 2
    auth:
      # NONE, LOGIN, REGISTER or AUTO. AUTO reacts to configured prompt text,
      # then falls back to login followed by register for first-time accounts.
      mode: "AUTO"
      login-command: "login {password}"
      register-command: "register {password} {password}"
      login-delay-ms: 1000
      fallback-register-delay-ms: 2500
      after-auth-delay-ms: 1500
      login-prompts:
        - "(?i)(please login|/login|请登录|请输入密码)"
      register-prompts:
        - "(?i)(please register|/register|请注册)"
      success-messages:
        - "(?i)(login successful|successfully logged|登录成功|认证成功)"
    server-switch-command: "server {server}"
    server-switch-delay-ms: 3000
    after-login-commands:
      - "res tp ironfarm"
